<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>RocketMQ 部署架构图</title>
  <desc>Broker 向 NameServer 注册路由，Producer 与 Consumer 从 NameServer 拉取路由，Producer 发送消息给 Broker，Broker 投递给 Consumer，Dashboard 负责监控。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">RocketMQ 部署架构</text>

  <g>
    <rect x="250" y="64" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="340" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">NameServer</text>
    <text x="340" y="108" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">路由中心 :9876</text>
  </g>

  <g>
    <rect x="250" y="180" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="340" y="204" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Broker</text>
    <text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">存储/收发 :10911</text>
  </g>

  <g>
    <rect x="30" y="184" width="150" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="105" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">Producer</text>
    <text x="105" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3B6D11">订单/撮合服务</text>
  </g>

  <g>
    <rect x="490" y="184" width="150" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="565" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Consumer</text>
    <text x="565" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">记账/推送服务</text>
  </g>

  <g>
    <rect x="250" y="300" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Dashboard</text>
    <text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">控制台 :8080</text>
  </g>

  <line x1="340" y1="180" x2="340" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="184" x2="298" y2="122" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="540" y1="184" x2="382" y2="122" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="180" y1="212" x2="248" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="208" x2="488" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="300" x2="340" y2="240" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <circle cx="340" cy="151" r="9" fill="#444441"/>
  <text x="340" y="151" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff">1</text>
  <text x="358" y="151" font-family="sans-serif" font-size="12" fill="#5F5E5A">注册</text>

  <circle cx="225" cy="152" r="9" fill="#444441"/>
  <text x="225" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff">2</text>
  <text x="225" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">拉路由</text>

  <circle cx="460" cy="152" r="9" fill="#444441"/>
  <text x="460" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff">3</text>
  <text x="460" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">拉路由</text>

  <circle cx="214" cy="210" r="9" fill="#444441"/>
  <text x="214" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff">4</text>
  <text x="214" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">发消息</text>

  <circle cx="459" cy="210" r="9" fill="#444441"/>
  <text x="459" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#ffffff">5</text>
  <text x="459" y="191" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">投递</text>

  <text x="356" y="272" font-family="sans-serif" font-size="12" fill="#888780">监控</text>
</svg>
