# RocketMQ Broker 配置文件
# 容器内路径：/opt/rocketmq/broker.conf

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：对外暴露的地址。
# host.docker.internal 指向宿主机（Docker Desktop Mac/Win 原生支持），
# 配合 compose 里的 extra_hosts，宿主机上的 Spring Boot 应用通过映射端口 10911 即可连上 broker。
# 若后续把 Spring Boot 也放进同一个 docker 网络，同样可用（走宿主机端口映射）。
brokerIP1 = host.docker.internal
namesrvAddr = rocketmq-namesrv:9876

# 开发环境允许自动创建 Topic，省去手动建 Topic
autoCreateTopicEnable = true
